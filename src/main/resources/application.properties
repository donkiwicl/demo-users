spring.application.name=users
server.port=${PORT:8080}
server.servlet.context-path=/api/v1/

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:users}
spring.datasource.username=${MYSQL_USER:users}
spring.datasource.password=${MYSQL_PASSWORD:users}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Secreto para firmar los JWT. En desarrollo usa el valor por defecto, pero en
# produccion DEBE entregarse por variable de entorno (JWT_SECRET) con un valor
# largo y aleatorio. Nunca subas un secreto real al repositorio.
app.jwt.secret=${JWT_SECRET:dev-secret-key-dev-secret-key-dev-secret-key-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.root=WARN
logging.level.org.springframework.web=DEBUG
logging.level.cl.duoc.kiosco=TRACE
logging.file.name=app.log
logging.file.path=./logs
